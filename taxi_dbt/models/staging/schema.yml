version: 2

sources:
  - name: staging
    database: dev
    schema: public
    tables:
      - name: green_tripdata
      - name: yellow_tripdata

models:
  - name: stg_green_tripdata
    columns:
      - name: unique_row_id
        description: >
          This is the table's unique identifier. It ensures there are no duplicates in the data
        data_tests:
          - unique
          - not_null
      - name: vendor_id
        description: >
          A code indicating the LPEP provider that provided the record.
          1 = Creative Mobile Technologies, LLC
          2 = Curb Mobility, LLC
          6 = Myle Technologies Inc
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 6]
                quote: false
      - name: pickup_datetime
        description: >
          The date and time when the meter was engaged
        data_tests:
          - not_null
      - name: dropoff_datetime
        description: >
          The date and time when the meter was disengaged
        data_tests:
          - not_null
      - name: store_and_fwd_flag
        description: >
          This flag indicates whether the trip record was held in vehicle memory before
          sending to the vendor, aka “store and forward,” because the vehicle did not
          have a connection to the server
      - name: rate_code_id
        description: >
          The final rate code in effect at the end of the trip.
          1 = Standard rate
          2 = JFK
          3 = Newark
          4 = Nassau or Westchester
          5 = Negotiated fare
          6 = Group ride
          99 = Null/unknown
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 99]
                quote: false
      - name: pickup_location_id
        description: >
          TLC Taxi Zone in which the taximeter was engaged
        data_tests:
          - relationships:
              arguments:
                to: ref('taxi_zone_lookup')
                field: locationid
      - name: dropoff_location_id
        description: >
          TLC Taxi Zone in which the taximeter was disengaged
        data_tests:
          - relationships:
              arguments:
                to: ref('taxi_zone_lookup')
                field: locationid
      - name: passenger_count
        description: >
          The number of passengers in the vehicle
        data_tests:
          - is_positive
      - name: trip_distance
        description: >
          The elapsed trip distance in miles reported by the taximeter
        data_tests:
          - is_positive
      - name: fare_amount
        description: >
          The time-and-distance fare calculated by the meter
        data_tests:
          - is_positive
      - name: extra
        description: >
          Miscellaneous extras and surcharges
        data_tests:
          - is_positive
      - name: mta_tax
        description: >
          Tax that is automatically triggered based on the metered rate in use
        data_tests:
          - is_positive
      - name: tip_amount
        description: >
          This field is automatically populated for credit card tips. Cash
          tips are not included
        data_tests:
          - is_positive
      - name: tolls_amount
        description: >
          Total amount of all tolls paid in trip
        data_tests:
          - is_positive
      - name: improvement_surcharge
        description: >
          Improvement surcharge assessed trips at the flag drop. The improvement
          surcharge began being levied in 2015.
        data_tests:
          - is_positive
      - name: total_amount
        description: >
          The total amount charged to passengers. Does not include cash tips
        data_tests:
          - is_positive
      - name: payment_type_id
        description: >
          A numeric code signifying how the passenger paid for the trip
          0 = Flex Fare trip
          1 = Credit card
          2 = Cash
          3 = No charge
          4 = Dispute
          5 = Unknown
          6 = Voided trip
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]
                quote: false
      - name: congestion_surcharge
        description: >
          Total amount collected in trip for NYS congestion surcharge
        data_tests:
          - is_positive
      - name: payment_type_description
        description: >
          A text description of how the passenger paid in relation to the
          payment_id
      - name: rate_code_description
        description: >
          A text description of the rate applied in relation to the rate_code_id
      - name: vendor_provider
        description: >
          A text description of the vendor provider in relation to the vendor_id

